services:
  app:
    build: .
    image: blink-workbench:local
    container_name: blink-workbench
    env_file:
      - .env
    environment:
      APP_ENV: production
      WORKFLOW_TEXT_EXECUTOR: api
      WORKFLOW_LOCAL_CODEX_ENABLED: "false"
      ORIGINAL_WORKFLOW_EXECUTION_MODE: cloud-worker
      ORIGINAL_WORKFLOW_FORCE_CLOUD_WORKER: "true"
      DREAMINA_HOME: /app/data/dreamina-home
      DREAMINA_OUTPUT_DIR: /app/data/jimeng-cli
    volumes:
      - ./data:/app/data
    ports:
      - "3000:3000"
    restart: unless-stopped
